# Bot Army Public Repositories
# Source of truth for Starter (independent of main monorepo)
# Channels: stable (frozen releases), latest (recent stable), nightly (main branch)

[settings]
github_org = "ergon-automation-labs"
default_channel = "stable"

# ============================================================================
# CORE PACK (Framework + Essential Services)
# ============================================================================

